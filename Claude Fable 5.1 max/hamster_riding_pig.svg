    <circle cx="172" cy="500" r="13"/>
    <circle cx="146" cy="504" r="8"/>
    <circle cx="642" cy="482" r="26"/>
    <circle cx="682" cy="490" r="19"/>
    <circle cx="716" cy="496" r="13"/>
    <circle cx="742" cy="500" r="8"/>
