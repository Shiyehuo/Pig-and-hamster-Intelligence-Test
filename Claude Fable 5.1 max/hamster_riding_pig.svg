  <path d="M0 516 Q260 494 520 512 Q740 526 900 514 L900 560 L0 560 Z" fill="#7cbb52" opacity="0.75"/>
  <ellipse cx="450" cy="492" rx="268" ry="24" fill="#5d9a3e" opacity="0.35"/>

