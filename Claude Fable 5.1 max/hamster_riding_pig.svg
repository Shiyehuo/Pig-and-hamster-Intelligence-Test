    <path d="M112 502 q5 -14 10 0"/>
    <path d="M792 496 q6 -18 12 0"/>
    <path d="M808 498 q5 -14 10 0"/>
    <path d="M618 512 q6 -16 12 0"/>
    <path d="M330 508 q6 -16 12 0"/>
