  <ellipse cx="448" cy="252" rx="19" ry="12" fill="#ffd3dd" stroke="#e8a0b4" stroke-width="3"/>
  <!-- 头 -->
  <circle cx="492" cy="140" r="55" fill="url(#hamGrad)" stroke="#d99b4a" stroke-width="3.5"/>
  <!-- 耳朵 -->
  <circle cx="464" cy="92" r="20" fill="#f2b95f" stroke="#d99b4a" stroke-width="3"/>
  <circle cx="464" cy="92" r="11" fill="#ffb8c6"/>
  <circle cx="528" cy="86" r="20" fill="#f2b95f" stroke="#d99b4a" stroke-width="3"/>
  <circle cx="528" cy="86" r="11" fill="#ffb8c6"/>
  <!-- 口鼻 -->
  <ellipse cx="516" cy="168" rx="31" ry="23" fill="#fff3d9"/>
  <ellipse cx="527" cy="157" rx="7.5" ry="6" fill="#e2798f"/>
  <path d="M527 163 q-7 9 -16 6 M527 163 q7 9 16 6" stroke="#b06a6a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
