<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="仓鼠骑在小猪背上奔跑">
  <title>仓鼠骑在小猪背上奔跑</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.65" stop-color="#e9f7ff"/>
      <stop offset="1" stop-color="#fdf7e6"/>
    </linearGradient>
    <linearGradient id="pigGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc9de"/>
      <stop offset="1" stop-color="#f78fbb"/>
    </linearGradient>
    <linearGradient id="hamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98f"/>
      <stop offset="1" stop-color="#f2b95f"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5e58a"/>
      <stop offset="1" stop-color="#8ecb63"/>
    </linearGradient>
  </defs>

  <!-- 天空与太阳 -->
  <rect width="900" height="560" fill="url(#skyGrad)"/>
  <circle cx="118" cy="92" r="66" fill="#ffe28a" opacity="0.35"/>
  <circle cx="118" cy="92" r="46" fill="#ffd968"/>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="252" cy="104" rx="58" ry="26"/>
    <ellipse cx="300" cy="92" rx="44" ry="22"/>
    <ellipse cx="212" cy="94" rx="36" ry="18"/>
    <ellipse cx="706" cy="84" rx="52" ry="22"/>
    <ellipse cx="748" cy="74" rx="36" ry="16"/>
    <ellipse cx="672" cy="76" rx="30" ry="14"/>
  </g>

  <!-- 小鸟 -->
  <g stroke="#7fb3d5" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M170 170 q10 -9 20 0 q10 -9 20 0"/>
    <path d="M236 192 q8 -7 16 0 q8 -7 16 0"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9">
