    <path d="M538 178 q28 2 44 0"/>
    <path d="M536 184 q26 10 38 22"/>
    <path d="M496 174 q-26 -8 -42 -16"/>
    <path d="M494 180 q-28 2 -46 0"/>
  </g>
  <!-- 眼睛 -->
  <circle cx="494" cy="130" r="9.5" fill="#33200f"/>
  <circle cx="497" cy="126" r="3.2" fill="#ffffff"/>
  <circle cx="528" cy="136" r="9.5" fill="#33200f"/>
  <circle cx="531" cy="132" r="3.2" fill="#ffffff"/>
  <!-- 腮红 -->
  <ellipse cx="466" cy="164" rx="13" ry="9" fill="#ffb3c1" opacity="0.85"/>
  <!-- 围巾 -->
  <path d="M432 178 Q466 206 512 184" stroke="#e8453c" stroke-width="22" fill="none" stroke-linecap="round"/>
  <circle cx="434" cy="182" r="13" fill="#d63a32"/>
  <!-- 前爪与缰绳 -->
  <ellipse cx="486" cy="228" rx="16" ry="12" fill="#f2b95f" stroke="#d99b4a" stroke-width="3" transform="rotate(-18 486 228)"/>
  <ellipse cx="514" cy="238" rx="16" ry="12" fill="#f2b95f" stroke="#d99b4a" stroke-width="3" transform="rotate(-10 514 238)"/>
  <path d="M514 238 Q556 244 592 242" stroke="#8a4a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
