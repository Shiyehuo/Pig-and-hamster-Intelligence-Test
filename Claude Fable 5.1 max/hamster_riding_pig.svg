  <path d="M622 240 Q628 192 668 204 Q684 214 668 244 Z" fill="#f9aacb" stroke="#e07aa6" stroke-width="3"/>
  <path d="M632 234 Q638 208 662 216 Q672 224 662 238 Z" fill="#ffd1e3"/>
