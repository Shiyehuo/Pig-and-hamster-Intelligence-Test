  <ellipse cx="268" cy="462" rx="21" ry="15" fill="#a95f84"/>
  <path d="M268 450 v24" stroke="#7e4462" stroke-width="3"/>
  <ellipse cx="650" cy="460" rx="21" ry="15" fill="#a95f84"/>
  <path d="M650 448 v24" stroke="#7e4462" stroke-width="3"/>
