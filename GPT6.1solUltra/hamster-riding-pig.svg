<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">仓鼠骑着小猪奔跑</title>
  <desc id="desc">一只金黄的小仓鼠围着蓝绿色围巾，坐在粉红色小猪背上。小猪开心地向右奔跑，身后有速度线和扬起的尘土，周围是柔和的草地和小花。</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#fff9e9"/>
      <stop offset="1" stop-color="#fff1d9"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#ffe8b2"/>
      <stop offset="1" stop-color="#ffe8b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pig" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#ffd5d4"/>
      <stop offset=".62" stop-color="#ffb8bf"/>
      <stop offset="1" stop-color="#f69cab"/>
    </linearGradient>
    <linearGradient id="pigHead" x1="0" y1="0" x2=".4" y2="1">
      <stop stop-color="#ffdbd7"/>
      <stop offset="1" stop-color="#ffb5be"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#ffd899"/>
      <stop offset="1" stop-color="#ecac62"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8bd9d4"/>
      <stop offset="1" stop-color="#4caeaf"/>
    </linearGradient>
    <style>
      .outline { stroke: #734c42; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #734c42; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .speed { fill: none; stroke: #ddbc8e; stroke-width: 7; stroke-linecap: round; }
    </style>
