<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- 小猪渐变 -->
    <linearGradient id="pigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB6C1" />
      <stop offset="100%" stop-color="#FF8DA1" />
    </linearGradient>
    <!-- 仓鼠渐变 -->
    <linearGradient id="hamsterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5DEB3" />
      <stop offset="100%" stop-color="#DEB887" />
    </linearGradient>
    <!-- 柔和阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="#E8F4F8" />

  <!-- 地面 -->
  <path d="M 0 265 Q 100 255 200 260 T 400 265 L 400 300 L 0 300 Z" fill="#D4E6C3" />
  <path d="M 0 265 Q 100 255 200 260 T 400 265" fill="none" stroke="#A3C9A0" stroke-width="2" stroke-linecap="round" />

  <!-- 地面阴影 -->
  <ellipse cx="210" cy="268" rx="75" ry="8" fill="#B8D4A8" opacity="0.7" filter="url(#shadow)" />

  <!-- 速度线 -->
  <g stroke="#A8C0D0" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <line x1="25" y1="175" x2="85" y2="175" />
    <line x1="15" y1="200" x2="65" y2="200" />
    <line x1="325" y1="165" x2="385" y2="165" />
    <line x1="335" y1="190" x2="375" y2="190" />
    <line x1="315" y1="215" x2="365" y2="215" />
  </g>

  <!-- 小猪 -->
  <g id="pig">
    <!-- 后腿 -->
    <path d="M 155 205 L 130 245 L 140 255 L 160 215 Z" fill="url(#pigGrad)" stroke="#E07A8A" stroke-width="1.5" />
    <path d="M 165 205 L 135 240 L 145 250 L 170 210 Z" fill="url(#pigGrad)" stroke="#E07A8A" stroke-width="1.5" />
    <!-- 身体 -->
    <ellipse cx="200" cy="185" rx="62" ry="38" fill="url(#pigGrad)" stroke="#E07A8A" stroke-width="2" transform="rotate(-8 200 185)" />
    <!-- 前腿 -->
    <path d="M 235 205 L 260 245 L 250 255 L 230 215 Z" fill="url(#pigGrad)" stroke="#E07A8A" stroke-width="1.5" />
    <path d="M 245 205 L 270 240 L 260 250 L 240 210 Z" fill="url(#pigGrad)" stroke="#E07A8A" stroke-width="1.5" />
    <!-- 头部 -->
    <circle cx="255" cy="155" r="27" fill="url(#pigGrad)" stroke="#E07A8A" stroke-width="2" />
    <!-- 鼻子 -->
    <ellipse cx="280" cy="160" rx="16" ry="11" fill="#FF9EAA" stroke="#E07A8A" stroke-width="1.5" />
    <circle cx="285" cy="158" r="2.5" fill="#D45A6A" />
    <circle cx="295" cy="162" r="2.5" fill="#D45A6A" />
    <!-- 眼睛 -->
    <circle cx="265" cy="148" r="4" fill="#333" />
    <circle cx="266.5" cy="147" r="1.5" fill="white" />
    <!-- 耳朵 -->
    <path d="M 250 135 Q 240 115 260 120 Q 270 125 265 135 Z" fill="#FF9EAA" stroke="#E07A8A" stroke-width="1.5" />
    <!-- 尾巴 -->
    <path d="M 138 185 Q 122 175 127 160 Q 132 150 142 155 Q 147 165 138 180 Z" fill="#FF9EAA" stroke="#E07A8A" stroke-width="1.5" />
    <!-- 腮红 -->
    <ellipse cx="260" cy="165" rx="5" ry="2.5" fill="#FFB6C1" opacity="0.7" />
  </g>

  <!-- 仓鼠 -->
  <g id="hamster">
    <!-- 身体 -->
    <ellipse cx="215" cy="145" rx="17" ry="13" fill="url(#hamsterGrad)" stroke="#C8A87C" stroke-width="1.5" />
    <!-- 头部 -->
    <circle cx="222" cy="130" r="15" fill="url(#hamsterGrad)" stroke="#C8A87C" stroke-width="1.5" />
    <!-- 耳朵 -->
    <circle cx="214" cy="118" r="5.5" fill="#F5DEB3" stroke="#C8A87C" stroke-width="1" />
    <circle cx="230" cy="120" r="5.5" fill="#F5DEB3" stroke="#C8A87C" stroke-width="1" />
    <circle cx="214" cy="118" r="2.5" fill="#FFB6C1" opacity="0.6" />
    <circle cx="230" cy="120" r="2.5" fill="#FFB6C1" opacity="0.6" />
    <!-- 眼睛 -->
    <circle cx="226" cy="128" r="2.5" fill="#222" />
    <circle cx="227" cy="127" r="1" fill="white" />
    <circle cx="236" cy="130" r="2.5" fill="#222" />
    <circle cx="237" cy="129" r="1" fill="white" />
    <!-- 鼻子 -->
    <circle cx="238" cy="135" r="2" fill="#FFB6C1" />
    <!-- 小鞍毯 -->
    <path d="M 200 140 Q 215 134 230 140 L 225 148 Q 215 144 205 148 Z" fill="#FF6B6B" stroke="#D94A4A" stroke-width="1" />
    <!-- 腮红 -->
    <ellipse cx="224" cy="138" rx="3.5" ry="1.8" fill="#FFB6C1" opacity="0.5" />
    <!-- 收拢的小脚 -->
    <path d="M 205 155 L 200 164 L 210 164 L 212 155 Z" fill="#DEB887" stroke="#C8A87C" stroke-width="1" />
    <path d="M 222 155 L 219 164 L 229 164 L 226 155 Z" fill="#DEB887" stroke="#C8A87C" stroke-width="1" />
  </g>

  <!-- 奔跑扬起的尘土 -->
  <g fill="#C8D8E0" opacity="0.6">
    <circle cx="185" cy="262" r="3" />
    <circle cx="200" cy="265" r="2" />
    <circle cx="215" cy="260" r="3.5" />
    <circle cx="230" cy="263" r="2.5" />
    <circle cx="245" cy="261" r="3" />
    <circle cx="170" cy="258" r="1.5" />
    <circle cx="255" cy="259" r="2" />
  </g>
</svg>
