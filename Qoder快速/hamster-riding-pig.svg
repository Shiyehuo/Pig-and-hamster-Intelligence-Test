<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff8e1;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="450" fill="url(#skyGradient)"/>
  
  <!-- 草地 -->
  <ellipse cx="300" cy="400" rx="320" ry="60" fill="#c8e6c9"/>
  <ellipse cx="300" cy="410" rx="280" ry="45" fill="#a5d6a7"/>

  <!-- 运动线 -->
  <g stroke="#90a4ae" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="80" y1="280" x2="160" y2="280"/>
    <line x1="60" y1="310" x2="130" y2="310"/>
    <line x1="90" y1="340" x2="170" y2="340"/>
    <line x1="450" y1="270" x2="520" y2="270"/>
    <line x1="480" y1="300" x2="560" y2="300"/>
  </g>

  <!-- 小猪 -->
  <g transform="translate(160, 150)" filter="url(#softShadow)">
    <!-- 尾巴 -->
    <path d="M 10,140 Q -15,130 5,115 Q 20,130 15,145" fill="none" stroke="#f48fb1" stroke-width="6" stroke-linecap="round"/>
    
    <!-- 后腿（奔跑） -->
    <ellipse cx="80" cy="210" rx="22" ry="12" fill="#f06292" transform="rotate(-30, 80, 210)"/>
    <ellipse cx="180" cy="205" rx="22" ry="12" fill="#f06292" transform="rotate(25, 180, 205)"/>
    
    <!-- 身体 -->
    <ellipse cx="150" cy="150" rx="110" ry="75" fill="#f8bbd0"/>
    <ellipse cx="150" cy="150" rx="85" ry="55" fill="#fce4ec"/>
    
    <!-- 前腿 -->
    <ellipse cx="210" cy="185" rx="18" ry="10" fill="#f06292" transform="rotate(-15, 210, 185)"/>
    <ellipse cx="95" cy="190" rx="18" ry="10" fill="#f06292" transform="rotate(20, 95, 190)"/>
    
    <!-- 猪蹄 -->
    <ellipse cx="70" cy="225" rx="10" ry="6" fill="#ec407a"/>
    <ellipse cx="200" cy="220" rx="10" ry="6" fill="#ec407a"/>
    <ellipse cx="225" cy="198" rx="9" ry="5" fill="#ec407a"/>
    <ellipse cx="80" cy="203" rx="9" ry="5" fill="#ec407a"/>
    
    <!-- 耳朵 -->
    <ellipse cx="245" cy="95" rx="18" ry="28" fill="#f48fb1" transform="rotate(15, 245, 95)"/>
    <ellipse cx="245" cy="95" rx="10" ry="18" fill="#f06292" transform="rotate(15, 245, 95)"/>
    <ellipse cx="215" cy="85" rx="15" ry="24" fill="#f48fb1" transform="rotate(-10, 215, 85)"/>
    <ellipse cx="215" cy="85" rx="8" ry="15" fill="#f06292" transform="rotate(-10, 215, 85)"/>
    
    <!-- 头部 -->
    <circle cx="230" cy="130" r="55" fill="#f8bbd0"/>
    
    <!-- 猪鼻子 -->
    <ellipse cx="275" cy="130" rx="16" ry="12" fill="#f06292"/>
    <circle cx="270" cy="130" r="3" fill="#880e4f"/>
    <circle cx="280" cy="130" r="3" fill="#880e4f"/>
    
    <!-- 眼睛 -->
    <circle cx="250" cy="115" r="6" fill="#3e2723"/>
    <circle cx="252" cy="113" r="2" fill="white"/>
    
    <!-- 腮红 -->
    <ellipse cx="240" cy="145" rx="10" ry="6" fill="#f48fb1" opacity="0.7"/>
    
    <!-- 嘴巴 -->
    <path d="M 265,148 Q 255,155 245,148" fill="none" stroke="#ad1457" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 仓鼠 -->
  <g transform="translate(160, 150)" filter="url(#softShadow)">
    <!-- 仓鼠身体 -->
    <ellipse cx="145" cy="95" rx="38" ry="32" fill="#d7ccc8"/>
    <ellipse cx="145" cy="95" rx="25" ry="20" fill="#efebe9"/>
    
    <!-- 仓鼠耳朵 -->
    <circle cx="120" cy="72" r="10" fill="#d7ccc8"/>
    <circle cx="120" cy="72" r="6" fill="#bcaaa4"/>
    <circle cx="170" cy="72" r="10" fill="#d7ccc8"/>
    <circle cx="170" cy="72" r="6" fill="#bcaaa4"/>
    
    <!-- 仓鼠头 -->
    <circle cx="145" cy="85" r="32" fill="#d7ccc8"/>
    
    <!-- 仓鼠眼睛 -->
    <circle cx="135" cy="80" r="4" fill="#3e2723"/>
    <circle cx="155" cy="80" r="4" fill="#3e2723"/>
    <circle cx="136" cy="79" r="1.5" fill="white"/>
    <circle cx="156" cy="79" r="1.5" fill="white"/>
    
    <!-- 仓鼠鼻子 -->
    <ellipse cx="145" cy="92" rx="4" ry="3" fill="#ffab91"/>
    
    <!-- 仓鼠嘴巴 -->
    <path d="M 145,95 Q 140,100 135,96" fill="none" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 145,95 Q 150,100 155,96" fill="none" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- 仓鼠腮红 -->
    <ellipse cx="125" cy="92" rx="6" ry="4" fill="#ffccbc" opacity="0.8"/>
    <ellipse cx="165" cy="92" rx="6" ry="4" fill="#ffccbc" opacity="0.8"/>
    
    <!-- 仓鼠小手（抓着猪） -->
    <ellipse cx="115" cy="105" rx="7" ry="4" fill="#d7ccc8" transform="rotate(-20, 115, 105)"/>
    <ellipse cx="175" cy="105" rx="7" ry="4" fill="#d7ccc8" transform="rotate(20, 175, 105)"/>
    
    <!-- 仓鼠脚 -->
    <ellipse cx="125" cy="122" rx="8" ry="5" fill="#d7ccc8"/>
    <ellipse cx="165" cy="122" rx="8" ry="5" fill="#d7ccc8"/>
  </g>

  <!-- 速度效果线 -->
  <g stroke="#81d4fa" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="50" y1="200" x2="120" y2="200"/>
    <line x1="30" y1="230" x2="90" y2="230"/>
    <line x1="520" y1="220" x2="580" y2="220"/>
  </g>

  <!-- 装饰小花 -->
  <g transform="translate(480, 360)">
    <circle cx="0" cy="0" r="6" fill="#fff176"/>
    <circle cx="-8" cy="-6" r="5" fill="#ff8a80"/>
    <circle cx="8" cy="-6" r="5" fill="#ff8a80"/>
    <circle cx="-8" cy="6" r="5" fill="#ff8a80"/>
    <circle cx="8" cy="6" r="5" fill="#ff8a80"/>
  </g>
  <g transform="translate(100, 380)">
    <circle cx="0" cy="0" r="5" fill="#fff176"/>
    <circle cx="-7" cy="-5" r="4" fill="#ce93d8"/>
    <circle cx="7" cy="-5" r="4" fill="#ce93d8"/>
    <circle cx="-7" cy="5" r="4" fill="#ce93d8"/>
    <circle cx="7" cy="5" r="4" fill="#ce93d8"/>
  </g>
</svg>