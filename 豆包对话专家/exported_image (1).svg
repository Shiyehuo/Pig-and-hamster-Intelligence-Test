<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景草地 -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f4ff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="pigBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1"/>
      <stop offset="100%" stop-color="#ff9aaa"/>
    </linearGradient>
    <linearGradient id="hamsterBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6b88a"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
  </defs>
  
  <!-- 天空背景 -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  
  <!-- 地面 -->
  <ellipse cx="400" cy="460" rx="500" ry="50" fill="#90ee90"/>
  
  <!-- 速度线 -->
  <line x1="100" y1="250" x2="50" y2="250" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="280" x2="60" y2="280" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="310" x2="50" y2="310" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 小猪身体 -->
  <g transform="translate(200, 200)">
    <!-- 后腿 -->
    <ellipse cx="180" cy="170" rx="22" ry="35" fill="url(#pigBody)" transform="rotate(-20 180 170)"/>
    <ellipse cx="160" cy="175" rx="20" ry="30" fill="url(#pigBody)" transform="rotate(15 160 175)"/>
    
    <!-- 前腿 -->
    <ellipse cx="320" cy="165" rx="20" ry="32" fill="url(#pigBody)" transform="rotate(25 320 165)"/>
    <ellipse cx="340" cy="155" rx="18" ry="28" fill="url(#pigBody)" transform="rotate(-10 340 155)"/>
    
    <!-- 主体 -->
    <ellipse cx="250" cy="120" rx="130" ry="80" fill="url(#pigBody)"/>
    
    <!-- 肚子 -->
    <ellipse cx="250" cy="140" rx="100" ry="55" fill="#ffc8d0"/>
    
    <!-- 尾巴 -->
    <path d="M 125 110 Q 100 90 110 70 Q 120 60 130 75" stroke="#ff9aaa" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- 猪头 -->
    <ellipse cx="370" cy="95" rx="55" ry="50" fill="url(#pigBody)"/>
    
    <!-- 猪耳朵 -->
    <ellipse cx="340" cy="50" rx="20" ry="28" fill="#ff9aaa" transform="rotate(-20 340 50)"/>
    <ellipse cx="375" cy="45" rx="18" ry="26" fill="#ff9aaa" transform="rotate(10 375 45)"/>
    <ellipse cx="342" cy="52" rx="12" ry="18" fill="#ffb6c1" transform="rotate(-20 342 52)"/>
    <ellipse cx="377" cy="47" rx="10" ry="16" fill="#ffb6c1" transform="rotate(10 377 47)"/>
    
    <!-- 猪鼻子 -->
    <ellipse cx="410" cy="100" rx="22" ry="18" fill="#ffb0bc"/>
    <circle cx="403" cy="100" r="5" fill="#e88a9a"/>
    <circle cx="417" cy="100" r="5" fill="#e88a9a"/>
    
    <!-- 猪眼睛 -->
    <circle cx="385" cy="80" r="6" fill="#333"/>
    <circle cx="387" cy="78" r="2" fill="#fff"/>
    
    <!-- 猪嘴 -->
    <path d="M 395 115 Q 405 122 415 115" stroke="#d87888" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- 猪蹄 -->
    <ellipse cx="175" cy="200" rx="15" ry="8" fill="#e88a9a"/>
    <ellipse cx="158" cy="202" rx="13" ry="7" fill="#e88a9a"/>
    <ellipse cx="325" cy="195" rx="14" ry="7" fill="#e88a9a"/>
    <ellipse cx="345" cy="182" rx="12" ry="6" fill="#e88a9a"/>
  </g>
  
  <!-- 仓鼠 -->
  <g transform="translate(280, 100)">
    <!-- 仓鼠身体 -->
    <ellipse cx="50" cy="50" rx="45" ry="40" fill="url(#hamsterBody)"/>
    
    <!-- 仓鼠肚子 -->
    <ellipse cx="50" cy="60" rx="35" ry="28" fill="#f5deb3"/>
    
    <!-- 仓鼠头 -->
    <circle cx="50" cy="15" r="30" fill="url(#hamsterBody)"/>
    
    <!-- 仓鼠耳朵 -->
    <ellipse cx="30" cy="-5" rx="10" ry="14" fill="#d4a574"/>
    <ellipse cx="70" cy="-5" rx="10" ry="14" fill="#d4a574"/>
    <ellipse cx="30" cy="-3" rx="6" ry="9" fill="#ffb6c1"/>
    <ellipse cx="70" cy="-3" rx="6" ry="9" fill="#ffb6c1"/>
    
    <!-- 仓鼠脸 -->
    <ellipse cx="50" cy="20" rx="22" ry="18" fill="#f5deb3"/>
    
    <!-- 仓鼠眼睛 -->
    <circle cx="40" cy="12" r="5" fill="#333"/>
    <circle cx="60" cy="12" r="5" fill="#333"/>
    <circle cx="41" cy="10" r="1.8" fill="#fff"/>
    <circle cx="61" cy="10" r="1.8" fill="#fff"/>
    
    <!-- 仓鼠鼻子 -->
    <ellipse cx="50" cy="22" rx="4" ry="3" fill="#ffb6c1"/>
    
    <!-- 仓鼠嘴 -->
    <path d="M 46 28 Q 50 32 54 28" stroke="#8b6914" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- 仓鼠腮红 -->
    <circle cx="32" cy="22" r="5" fill="#ffb6c1" opacity="0.6"/>
    <circle cx="68" cy="22" r="5" fill="#ffb6c1" opacity="0.6"/>
    
    <!-- 仓鼠前爪（抬起欢呼） -->
    <ellipse cx="15" cy="35" rx="8" ry="12" fill="#d4a574" transform="rotate(-40 15 35)"/>
    <ellipse cx="85" cy="35" rx="8" ry="12" fill="#d4a574" transform="rotate(40 85 35)"/>
    
    <!-- 仓鼠后爪 -->
    <ellipse cx="30" cy="85" rx="10" ry="6" fill="#d4a574"/>
    <ellipse cx="70" cy="85" rx="10" ry="6" fill="#d4a574"/>
    
    <!-- 仓鼠胡须 -->
    <line x1="30" y1="24" x2="15" y2="22" stroke="#8b6914" stroke-width="1"/>
    <line x1="30" y1="27" x2="15" y2="28" stroke="#8b6914" stroke-width="1"/>
    <line x1="70" y1="24" x2="85" y2="22" stroke="#8b6914" stroke-width="1"/>
    <line x1="70" y1="27" x2="85" y2="28" stroke="#8b6914" stroke-width="1"/>
  </g>
  
  <!-- 尘土效果 -->
  <ellipse cx="220" cy="395" rx="25" ry="8" fill="#d2b48c" opacity="0.5"/>
  <ellipse cx="200" cy="400" rx="18" ry="6" fill="#d2b48c" opacity="0.4"/>
  <ellipse cx="430" cy="390" rx="20" ry="7" fill="#d2b48c" opacity="0.5"/>
</svg>
