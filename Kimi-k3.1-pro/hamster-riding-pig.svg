    <path d="M840 333Q814 413 850 503" fill="none" stroke="#A66C51" stroke-width="9" stroke-linecap="round"/>
    <path d="M849 335Q828 412 858 497" fill="none" stroke="#E0AE78" stroke-width="3" stroke-linecap="round"/>
