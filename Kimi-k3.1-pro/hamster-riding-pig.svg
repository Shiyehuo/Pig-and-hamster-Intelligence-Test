    <path d="M377 421C323 374 276 405 293 446c15 37 69 24 61-11-7-29-49-20-45 8 3 22-21 33-42 24" fill="none" stroke="#633F3A" stroke-width="19" stroke-linecap="round"/>
    <path d="M377 421C323 374 276 405 293 446c15 37 69 24 61-11-7-29-49-20-45 8 3 22-21 33-42 24" fill="none" stroke="#F5A0B2" stroke-width="10" stroke-linecap="round"/>

