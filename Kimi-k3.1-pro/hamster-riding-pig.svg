<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">仓鼠骑着小猪飞奔</title>
  <desc id="desc">一只戴红围巾的金色小仓鼠抓着缰绳，开心地骑在粉红色小猪背上。小猪四蹄飞奔，身后扬起尘土，背景是温暖的阳光、云朵和草地。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DC"/>
      <stop offset="1" stop-color="#E7F6EF"/>
    </linearGradient>
    <linearGradient id="pigPink" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFC2CC"/>
      <stop offset="1" stop-color="#F396AA"/>
    </linearGradient>
    <linearGradient id="hamsterGold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F9CB79"/>
      <stop offset="1" stop-color="#DF9B4F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#765247" flood-opacity="0.16"/>
    </filter>
    <style>
      .line { stroke: #633F3A; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .fine { fill: none; stroke: #633F3A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .leg-outline { fill: none; stroke: #633F3A; stroke-width: 57; stroke-linecap: round; stroke-linejoin: round; }
      .leg-near { fill: none; stroke: #F5A0B2; stroke-width: 43; stroke-linecap: round; stroke-linejoin: round; }
      .leg-far { fill: none; stroke: #DF849B; stroke-width: 43; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- 温暖的田野背景 -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1000" cy="132" r="67" fill="#FFD976" opacity="0.9"/>
  <circle cx="1000" cy="132" r="88" fill="none" stroke="#FFD976" stroke-width="4" opacity="0.25"/>
  <g fill="#FFFFFF" opacity="0.8">
    <path d="M116 177c7-32 50-37 67-13 19-29 69-16 68 20 35-7 53 34 25 49H115c-38-5-37-51 1-56z"/>
    <path d="M760 122c5-24 38-29 53-11 15-23 55-13 54 15 27-5 41 27 19 39H759c-30-4-29-40 1-43z"/>
  </g>
  <path d="M0 553Q157 442 324 548T651 539T956 530T1200 526V800H0Z" fill="#C9E7C5"/>
  <path d="M0 612Q175 526 365 608T738 596T1200 575V800H0Z" fill="#A9D8AC"/>
  <path d="M0 664Q240 611 472 653T900 641T1200 629V800H0Z" fill="#8FCA9B"/>
  <g fill="none" stroke="#76B789" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M94 682q2-20-12-32m13 31q10-20 25-25M1060 657q0-22-14-35m16 34q9-22 25-30M1114 707q0-18-11-29m13 28q8-17 20-23"/>
  </g>
  <g fill="#FFF4D2" opacity="0.95">
    <circle cx="95" cy="648" r="6"/><circle cx="1075" cy="620" r="6"/><circle cx="1125" cy="675" r="5"/>
  </g>

  <!-- 速度线与扬尘 -->
  <g fill="none" stroke="#B99C83" stroke-width="8" stroke-linecap="round" opacity="0.45">
    <path d="M118 369h145M177 427h103M94 497h158M207 552h78"/>
  </g>
  <ellipse cx="613" cy="678" rx="351" ry="35" fill="#547A63" opacity="0.18"/>
  <g fill="#F4E5C8" stroke="#D8C29E" stroke-width="4" opacity="0.95">
    <circle cx="280" cy="630" r="31"/><circle cx="235" cy="649" r="22"/><circle cx="319" cy="657" r="24"/>
    <circle cx="396" cy="674" r="19"/><circle cx="190" cy="666" r="13"/>
  </g>
  <g fill="#F8EEDB" opacity="0.9">
    <circle cx="273" cy="583" r="13"/><circle cx="220" cy="609" r="9"/><circle cx="354" cy="625" r="11"/>
  </g>

