    <path d="M704 498Q737 576 678 638" class="leg-far"/>
    <path d="M316 584l44 17-12 35-46-18z" fill="#79545A" class="line"/>
    <path d="M654 629l46 4-3 37-48-4z" fill="#79545A" class="line"/>

    <!-- 近侧两腿，呈飞奔姿态 -->
    <path d="M507 503Q550 577 500 646" class="leg-outline"/>
    <path d="M507 503Q550 577 500 646" class="leg-near"/>
    <path d="M738 498Q772 564 852 598" class="leg-outline"/>
    <path d="M738 498Q772 564 852 598" class="leg-near"/>
    <path d="M476 638l48 5-3 38-51-5z" fill="#6A4950" class="line"/>
    <path d="M841 578l18 43 38-17-18-42z" fill="#6A4950" class="line"/>

    <!-- 小猪身体 -->
    <ellipse cx="579" cy="438" rx="238" ry="132" fill="url(#pigPink)" class="line"/>
    <path d="M408 472c44 83 185 115 292 54-79 72-242 63-292-54z" fill="#E9829B" opacity="0.32"/>
    <path d="M413 374c43-43 112-61 165-57" fill="none" stroke="#FFD8DF" stroke-width="13" stroke-linecap="round" opacity="0.8"/>

