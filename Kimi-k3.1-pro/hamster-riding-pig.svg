    <ellipse cx="873" cy="439" rx="8" ry="13" fill="#A85E70" transform="rotate(-9 873 439)"/>
    <ellipse cx="916" cy="439" rx="8" ry="13" fill="#A85E70" transform="rotate(9 916 439)"/>
    <path d="M810 380q18-18 38 0" class="fine"/>
    <path d="M800 361q16-9 30-3" fill="none" stroke="#633F3A" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="796" cy="430" rx="20" ry="12" fill="#ED7F9A" opacity="0.45"/>
    <path d="M852 495q31 27 61-2" class="fine"/>
    <path d="M876 507q10 7 20-1" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

    <!-- 马鞍与缰绳 -->
    <path d="M445 358Q538 299 647 340l22 84q-110-34-218 12z" fill="#4FA9A2" class="line"/>
    <path d="M463 375q85-45 174-17" fill="none" stroke="#9AD7C9" stroke-width="8" stroke-linecap="round"/>
    <path d="M454 414q98-30 208-3" fill="none" stroke="#287E7C" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="558" cy="328" rx="94" ry="29" fill="#A66C51" class="line"/>
    <ellipse cx="558" cy="322" rx="75" ry="16" fill="#D59B68"/>
    <path d="M503 273Q675 280 842 363M604 273Q718 297 842 363" fill="none" stroke="#633F3A" stroke-width="6" stroke-linecap="round"/>
    <path d="M503 273Q675 280 842 363M604 273Q718 297 842 363" fill="none" stroke="#C18A5C" stroke-width="3" stroke-linecap="round"/>
    <circle cx="842" cy="363" r="9" fill="#F3C36E" class="line"/>

    <!-- 仓鼠的红围巾，向后飘起 -->
    <path d="M522 211q-60-28-103-6-39 20-78-18 19 57 78 54 54-3 100 9z" fill="#E86656" class="line"/>
    <path d="M429 217q-39 4-64-14M466 218q-25 14-52 13" fill="none" stroke="#F89A7E" stroke-width="6" stroke-linecap="round"/>

    <!-- 仓鼠身体与小脚 -->
    <ellipse cx="558" cy="253" rx="80" ry="91" fill="url(#hamsterGold)" class="line"/>
    <ellipse cx="559" cy="273" rx="49" ry="57" fill="#FFF0CE"/>
    <ellipse cx="494" cy="328" rx="40" ry="23" fill="#E5A457" class="line" transform="rotate(-10 494 328)"/>
    <ellipse cx="622" cy="328" rx="40" ry="23" fill="#E5A457" class="line" transform="rotate(10 622 328)"/>
    <path d="M479 327l-7 7m22-9-4 10m117-10 4 10m11-12 7 8" fill="none" stroke="#A66B3E" stroke-width="4" stroke-linecap="round"/>

    <!-- 耳朵和圆脸 -->
    <circle cx="503" cy="103" r="38" fill="#E5A457" class="line"/>
    <circle cx="613" cy="103" r="38" fill="#E5A457" class="line"/>
    <circle cx="503" cy="103" r="21" fill="#F7C5A5"/>
    <circle cx="613" cy="103" r="21" fill="#F7C5A5"/>
    <circle cx="558" cy="158" r="78" fill="url(#hamsterGold)" class="line"/>
    <path d="M510 112q43-32 91 1" fill="none" stroke="#FFE0A0" stroke-width="11" stroke-linecap="round" opacity="0.75"/>
    <ellipse cx="532" cy="180" rx="35" ry="30" fill="#FFF0CE"/>
    <ellipse cx="584" cy="180" rx="35" ry="30" fill="#FFF0CE"/>
    <ellipse cx="532" cy="148" rx="9" ry="13" fill="#493630"/>
    <ellipse cx="585" cy="148" rx="9" ry="13" fill="#493630"/>
    <circle cx="535" cy="144" r="3.5" fill="#FFFFFF"/>
    <circle cx="588" cy="144" r="3.5" fill="#FFFFFF"/>
    <path d="M551 169q7-8 14 0-1 12-7 12t-7-12z" fill="#805047"/>
    <path d="M541 191q17 25 34 0c-3 31-30 31-34 0z" fill="#693F3B" class="line" stroke-width="4"/>
    <path d="M550 190h17v12h-17z" fill="#FFFFFF" stroke="#633F3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M547 215q12-8 24 0" fill="none" stroke="#EF8B86" stroke-width="7" stroke-linecap="round"/>
    <g fill="none" stroke="#805847" stroke-width="3.5" stroke-linecap="round">
      <path d="M506 177l-38-7m39 18-40 5m115-16 38-7m-39 18 40 5"/>
    </g>
    <ellipse cx="503" cy="169" rx="13" ry="8" fill="#ED9A82" opacity="0.55"/>
    <ellipse cx="613" cy="169" rx="13" ry="8" fill="#ED9A82" opacity="0.55"/>

    <!-- 围巾领口和抓紧缰绳的小爪子 -->
    <path d="M499 213q57 31 118 0l4 26q-63 31-126 0z" fill="#E86656" class="line"/>
    <path d="M505 229q52 20 107 0" fill="none" stroke="#F89A7E" stroke-width="5" stroke-linecap="round"/>
    <path d="M504 235q-30 9-19 39 8 20 30 4" fill="url(#hamsterGold)" class="line"/>
    <path d="M612 235q30 9 19 39-8 20-30 4" fill="url(#hamsterGold)" class="line"/>
    <circle cx="503" cy="274" r="15" fill="#F4BE70" class="line"/>
    <circle cx="604" cy="274" r="15" fill="#F4BE70" class="line"/>
    <path d="M495 270l13 6m88-6 13 6" fill="none" stroke="#B47843" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 前景的小草与飞起的尘点 -->
  <g fill="none" stroke="#5FA77C" stroke-width="6" stroke-linecap="round">
    <path d="M739 714q0-27-18-43m20 42q10-25 29-36M929 692q0-21-14-35m15 34q9-20 23-28"/>
  </g>
  <g fill="#D7B991">
    <ellipse cx="333" cy="563" rx="8" ry="5" transform="rotate(25 333 563)"/>
    <ellipse cx="279" cy="539" rx="6" ry="4" transform="rotate(25 279 539)"/>
    <ellipse cx="386" cy="593" rx="7" ry="4" transform="rotate(25 386 593)"/>
  </g>
</svg>
