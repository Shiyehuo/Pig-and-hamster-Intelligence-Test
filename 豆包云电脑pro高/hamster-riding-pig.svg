<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EC9F8"/>
      <stop offset="1" stop-color="#E3F4FF"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CCC65"/>
      <stop offset="1" stop-color="#5D9130"/>
    </linearGradient>
    <radialGradient id="pigBody" cx="0.42" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#FEE0EA"/>
      <stop offset="0.7" stop-color="#F8BBD0"/>
      <stop offset="1" stop-color="#F39DC0"/>
    </radialGradient>
    <linearGradient id="hamsterBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6B87F"/>
      <stop offset="1" stop-color="#CE9B5B"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF59D"/>
      <stop offset="1" stop-color="#FFC72D"/>
    </radialGradient>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- ============ 太阳 ============ -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 688 92" to="360 688 92" dur="45s" repeatCount="indefinite"/>
      <g stroke="#FFD24D" stroke-width="6" stroke-linecap="round">
        <line x1="688" y1="26" x2="688" y2="46"/>
        <line x1="688" y1="138" x2="688" y2="158"/>
        <line x1="622" y1="92" x2="642" y2="92"/>
        <line x1="734" y1="92" x2="754" y2="92"/>
        <line x1="641" y1="45" x2="655" y2="59"/>
        <line x1="721" y1="125" x2="735" y2="139"/>
        <line x1="735" y1="45" x2="721" y2="59"/>
        <line x1="655" y1="125" x2="641" y2="139"/>
      </g>
    </g>
    <circle cx="688" cy="92" r="40" fill="url(#sunGrad)"/>
  </g>

  <!-- ============ 云 ============ -->
  <g fill="#FFFFFF" opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="-160 80" to="830 80" dur="34s" begin="-20s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="36" ry="22"/>
      <ellipse cx="32" cy="-12" rx="30" ry="23"/>
      <ellipse cx="62" cy="2" rx="34" ry="20"/>
      <ellipse cx="30" cy="9" rx="44" ry="17"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="-160 150" to="830 150" dur="48s" begin="-16s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="28" ry="17"/>
      <ellipse cx="24" cy="-9" rx="23" ry="17"/>
      <ellipse cx="48" cy="1" rx="26" ry="15"/>
      <ellipse cx="22" cy="7" rx="34" ry="13"/>
    </g>
  </g>

  <!-- ============ 远山 ============ -->
  <path d="M0,412 Q160,322 320,382 Q440,340 560,372 Q680,340 800,378 L800,412 Z"
    fill="#AED581" opacity="0.65"/>
  <path d="M0,412 Q220,352 420,396 Q620,366 800,392 L800,412 Z"
    fill="#98C45E" opacity="0.8"/>

  <!-- ============ 草地 ============ -->
  <rect x="0" y="410" width="800" height="90" fill="url(#ground)"/>

  <!-- 中景草丛（缓慢后退） -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-800 0" dur="4s" repeatCount="indefinite" calcMode="linear"/>
    <g stroke="#4E7E2C" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
      <g transform="translate(70,440)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
      <g transform="translate(210,452)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
      <g transform="translate(360,438)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
      <g transform="translate(520,450)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
      <g transform="translate(680,442)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
    </g>
    <g transform="translate(800,0)" stroke="#4E7E2C" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
      <g transform="translate(70,440)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
      <g transform="translate(210,452)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
      <g transform="translate(360,438)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
      <g transform="translate(520,450)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
      <g transform="translate(680,442)"><path d="M0,0 q-6,-14 -13,-19"/><path d="M0,0 q1,-17 3,-25"/><path d="M0,0 q7,-12 15,-17"/></g>
    </g>
  </g>

  <!-- 小花 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-800 0" dur="4s" repeatCount="indefinite" calcMode="linear"/>
    <g transform="translate(140,455)">
      <circle cx="0" cy="-6" r="4" fill="#FFF176"/><circle cx="0" cy="-6" r="1.6" fill="#F9A825"/>
    </g>
    <g transform="translate(450,465)">
      <circle cx="0" cy="-6" r="4" fill="#F48FB1"/><circle cx="0" cy="-6" r="1.6" fill="#F9A825"/>
    </g>
    <g transform="translate(620,470)">
      <circle cx="0" cy="-6" r="4" fill="#FFFFFF"/><circle cx="0" cy="-6" r="1.6" fill="#F9A825"/>
    </g>
    <g transform="translate(940,460)">
      <circle cx="0" cy="-6" r="4" fill="#FFF176"/><circle cx="0" cy="-6" r="1.6" fill="#F9A825"/>
    </g>
    <g transform="translate(1250,468)">
      <circle cx="0" cy="-6" r="4" fill="#F48FB1"/><circle cx="0" cy="-6" r="1.6" fill="#F9A825"/>
    </g>
  </g>

  <!-- ============ 速度线（小猪身后） ============ -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="40 0;-110 0" dur="0.5s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.2;0.8;1" dur="0.5s" repeatCount="indefinite"/>
      <line x1="150" y1="250" x2="95" y2="250" opacity="0.9"/>
      <line x1="180" y1="292" x2="118" y2="292" opacity="0.7"/>
      <line x1="140" y1="336" x2="82" y2="336" opacity="0.8"/>
      <line x1="190" y1="372" x2="135" y2="372" opacity="0.6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="60 0;-110 0" dur="0.5s" begin="-0.25s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.2;0.8;1" dur="0.5s" begin="-0.25s" repeatCount="indefinite"/>
      <line x1="160" y1="270" x2="105" y2="270" opacity="0.7"/>
      <line x1="130" y1="314" x2="70" y2="314" opacity="0.85"/>
      <line x1="175" y1="354" x2="120" y2="354" opacity="0.6"/>
    </g>
  </g>

  <!-- ============ 主体（小猪 + 仓鼠，整体起伏） ============ -->
  <g id="rider">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -9; 0 1; 0 0; 0 -9; 0 1; 0 0"
      keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333;1"
      dur="0.5s" repeatCount="indefinite"/>

    <!-- 卷尾巴（在身体后方） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-12 252 286; 12 252 286; -12 252 286" dur="0.25s" repeatCount="indefinite"/>
      <path d="M252,286 q-16,1 -16,15 q0,13 13,13 q11,0 11,-11 q0,-9 -9,-9 q-7,0 -7,7"
        fill="none" stroke="#EF95BB" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- 四条腿（先画，身体盖住上端） -->
    <!-- 左前腿（远侧，浅色）组B：后摆 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-26 452 348; 26 452 348; -26 452 348" dur="0.5s" repeatCount="indefinite"/>
      <path d="M452,348 Q440,376 430,402" fill="none" stroke="#F2A3C4" stroke-width="19" stroke-linecap="round"/>
      <ellipse cx="429" cy="405" rx="13" ry="9" fill="#C2597F"/>
    </g>
    <!-- 右后腿（近侧，深色）组B：后摆 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-26 330 352; 26 330 352; -26 330 352" dur="0.5s" repeatCount="indefinite"/>
      <path d="M330,352 Q346,378 357,403" fill="none" stroke="#F48FB1" stroke-width="19" stroke-linecap="round"/>
      <ellipse cx="358" cy="406" rx="13" ry="9" fill="#C2597F"/>
    </g>
    <!-- 左后腿（远侧，浅色）组A：前摆 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="26 300 352; -26 300 352; 26 300 352" dur="0.5s" repeatCount="indefinite"/>
      <path d="M300,352 Q282,378 266,404" fill="none" stroke="#F2A3C4" stroke-width="19" stroke-linecap="round"/>
      <ellipse cx="265" cy="407" rx="13" ry="9" fill="#C2597F"/>
    </g>
    <!-- 右前腿（近侧，深色）组A：前摆 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="26 478 348; -26 478 348; 26 478 348" dur="0.5s" repeatCount="indefinite"/>
      <path d="M478,348 Q496,376 509,402" fill="none" stroke="#F48FB1" stroke-width="19" stroke-linecap="round"/>
      <ellipse cx="510" cy="405" rx="13" ry="9" fill="#C2597F"/>
    </g>

    <!-- 小猪身体（含头、鼻的整体外轮廓） -->
    <path d="M248,300
      C250,244 305,210 380,208
      C446,206 478,224 498,216
      C528,206 558,232 570,264
      C581,293 564,315 538,318
      C512,322 488,312 474,336
      C454,369 405,389 345,384
      C288,380 250,352 248,330 Z"
      fill="url(#pigBody)" stroke="#E07AA3" stroke-width="3"/>

    <!-- 后耳（远侧） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-6 497 218; 7 497 218; -6 497 218" dur="0.25s" repeatCount="indefinite"/>
      <path d="M490,224 Q478,190 502,184 Q516,194 509,224 Z"
        fill="#F2A3C4" stroke="#E07AA3" stroke-width="2.5"/>
      <path d="M495,216 Q488,198 500,195 Q507,202 505,215 Z" fill="#F8BBD0"/>
    </g>
    <!-- 前耳（近侧） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="7 528 218; -6 528 218; 7 528 218" dur="0.25s" repeatCount="indefinite"/>
      <path d="M516,222 Q520,182 545,198 Q551,218 533,227 Z"
        fill="#F48FB1" stroke="#E07AA3" stroke-width="2.5"/>
      <path d="M521,214 Q525,194 538,202 Q540,214 530,220 Z" fill="#FBD0DE"/>
    </g>

    <!-- 猪拱嘴 -->
    <ellipse cx="552" cy="290" rx="28" ry="23" fill="#FBAEC8" stroke="#E07AA3" stroke-width="2.5"/>
    <!-- 辔头（鼻端笼头） -->
    <ellipse cx="562" cy="289" rx="11" ry="18" fill="none" stroke="#795548" stroke-width="3.5"/>
    <ellipse cx="560" cy="283" rx="3.6" ry="4.6" fill="#C2597F"/>
    <ellipse cx="560" cy="297" rx="3.6" ry="4.6" fill="#C2597F"/>

    <!-- 眼睛 -->
    <circle cx="514" cy="258" r="7" fill="#4A3B33"/>
    <circle cx="516.5" cy="255.5" r="2.4" fill="#FFFFFF"/>
    <!-- 眉毛 -->
    <path d="M506,246 q9,-6 18,-1" fill="none" stroke="#C2597F" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="498" cy="288" rx="12" ry="8" fill="#F48FB1" opacity="0.55"/>
    <!-- 微笑 -->
    <path d="M540,312 q8,8 18,2" fill="none" stroke="#C2597F" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ============ 缰绳（从猪耳上方跨过，末端握在仓鼠爪中） ============ -->
    <path d="M344,190 C400,160 470,150 520,168 C538,174 554,196 559,270" fill="none" stroke="#795548" stroke-width="4" stroke-linecap="round"/>
    <path d="M368,192 C415,168 475,158 520,175 C538,180 556,204 561,280" fill="none" stroke="#795548" stroke-width="4" stroke-linecap="round"/>

    <!-- ============ 仓鼠（随奔跑轻微颠簸） ============ -->
    <g id="hamster">
      <animateTransform attributeName="transform" type="rotate"
        values="3 355 228; -2 355 228; 3 355 228" dur="0.5s" repeatCount="indefinite"/>

      <!-- 后脚（坐着） -->
      <ellipse cx="318" cy="226" rx="15" ry="10" fill="#CE9B5B" stroke="#9C6F3D" stroke-width="2"/>
      <ellipse cx="392" cy="226" rx="15" ry="10" fill="#CE9B5B" stroke="#9C6F3D" stroke-width="2"/>

      <!-- 身体 -->
      <ellipse cx="355" cy="182" rx="50" ry="52" fill="url(#hamsterBack)" stroke="#9C6F3D" stroke-width="2.5"/>
      <!-- 肚子 -->
      <ellipse cx="355" cy="200" rx="33" ry="33" fill="#F6E7CF"/>

      <!-- 头部 -->
      <circle cx="355" cy="150" r="40" fill="url(#hamsterBack)" stroke="#9C6F3D" stroke-width="2.5"/>
      <!-- 浅色脸心 -->
      <ellipse cx="355" cy="160" rx="29" ry="26" fill="#F6E7CF"/>

      <!-- 耳朵 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="5 328 118; -5 328 118; 5 328 118" dur="0.25s" repeatCount="indefinite"/>
        <circle cx="328" cy="118" r="13" fill="#CE9B5B" stroke="#9C6F3D" stroke-width="2.5"/>
        <circle cx="328" cy="119" r="6.5" fill="#F6B8C4"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-5 382 118; 5 382 118; -5 382 118" dur="0.25s" repeatCount="indefinite"/>
        <circle cx="382" cy="118" r="13" fill="#CE9B5B" stroke="#9C6F3D" stroke-width="2.5"/>
        <circle cx="382" cy="119" r="6.5" fill="#F6B8C4"/>
      </g>

      <!-- 腮帮（颊囊） -->
      <circle cx="326" cy="166" r="13" fill="#F2D2A8"/>
      <circle cx="384" cy="166" r="13" fill="#F2D2A8"/>

      <!-- 眼睛 -->
      <circle cx="340" cy="146" r="5.5" fill="#3A2A1E"/>
      <circle cx="342" cy="144" r="1.8" fill="#FFFFFF"/>
      <circle cx="370" cy="146" r="5.5" fill="#3A2A1E"/>
      <circle cx="372" cy="144" r="1.8" fill="#FFFFFF"/>

      <!-- 鼻 -->
      <path d="M355,160 q-5,0 -5,4 q0,4 5,4 q5,0 5,-4 q0,-4 -5,-4 Z" fill="#F48FB1" stroke="#C2597F" stroke-width="1"/>
      <!-- 嘴 -->
      <path d="M355,168 v3 M355,171 q-5,5 -9,2 M355,171 q5,5 9,2"
        fill="none" stroke="#8A5A30" stroke-width="1.8" stroke-linecap="round"/>
      <!-- 胡须 -->
      <g stroke="#9C6F3D" stroke-width="1.4" stroke-linecap="round">
        <line x1="322" y1="166" x2="296" y2="160"/>
        <line x1="322" y1="171" x2="296" y2="172"/>
        <line x1="388" y1="166" x2="414" y2="160"/>
        <line x1="388" y1="171" x2="414" y2="172"/>
      </g>

      <!-- 围巾（系在脖子上，飘尾向后飘） -->
      <g>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-16 334 184; 10 334 184; -16 334 184" dur="0.25s" repeatCount="indefinite"/>
          <path d="M332,180 L292,188 L306,194 L296,206 L338,190 Z" fill="#E53935"/>
          <path d="M336,188 L302,202 L314,207 L306,218 L340,197 Z" fill="#C62828"/>
        </g>
        <ellipse cx="355" cy="185" rx="29" ry="9" fill="#E53935"/>
        <ellipse cx="355" cy="185" rx="29" ry="9" fill="none" stroke="#B71C1C" stroke-width="2"/>
        <circle cx="334" cy="185" r="6" fill="#C62828"/>
      </g>

      <!-- 前爪（握住缰绳） -->
      <ellipse cx="342" cy="192" rx="10" ry="12" fill="#E6B87F" stroke="#9C6F3D" stroke-width="2"/>
      <ellipse cx="368" cy="194" rx="10" ry="12" fill="#E6B87F" stroke="#9C6F3D" stroke-width="2"/>
    </g>
  </g>

  <!-- ============ 扬起的尘土 ============ -->
  <g fill="#EAD9BC">
    <g>
      <animate attributeName="cx" values="275;225" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;16" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.5s" repeatCount="indefinite"/>
      <circle cx="275" cy="408" r="3"/>
    </g>
    <g>
      <animate attributeName="cx" values="300;255" dur="0.5s" begin="-0.17s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;13" dur="0.5s" begin="-0.17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.5s" begin="-0.17s" repeatCount="indefinite"/>
      <circle cx="300" cy="412" r="3"/>
    </g>
    <g>
      <animate attributeName="cx" values="420;470" dur="0.5s" begin="-0.33s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;12" dur="0.5s" begin="-0.33s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.3;1" dur="0.5s" begin="-0.33s" repeatCount="indefinite"/>
      <circle cx="440" cy="410" r="3"/>
    </g>
  </g>

  <!-- ============ 前景草丛（快速后退） ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-800 0" dur="2s" repeatCount="indefinite" calcMode="linear"/>
    <g stroke="#3F6B24" stroke-width="5" stroke-linecap="round" fill="none">
      <g transform="translate(40,486)"><path d="M0,0 q-7,-16 -15,-22"/><path d="M0,0 q1,-20 3,-29"/><path d="M0,0 q8,-14 17,-19"/></g>
      <g transform="translate(260,492)"><path d="M0,0 q-7,-16 -15,-22"/><path d="M0,0 q1,-20 3,-29"/><path d="M0,0 q8,-14 17,-19"/></g>
      <g transform="translate(500,488)"><path d="M0,0 q-7,-16 -15,-22"/><path d="M0,0 q1,-20 3,-29"/><path d="M0,0 q8,-14 17,-19"/></g>
      <g transform="translate(740,493)"><path d="M0,0 q-7,-16 -15,-22"/><path d="M0,0 q1,-20 3,-29"/><path d="M0,0 q8,-14 17,-19"/></g>
    </g>
    <g transform="translate(800,0)" stroke="#3F6B24" stroke-width="5" stroke-linecap="round" fill="none">
      <g transform="translate(40,486)"><path d="M0,0 q-7,-16 -15,-22"/><path d="M0,0 q1,-20 3,-29"/><path d="M0,0 q8,-14 17,-19"/></g>
      <g transform="translate(260,492)"><path d="M0,0 q-7,-16 -15,-22"/><path d="M0,0 q1,-20 3,-29"/><path d="M0,0 q8,-14 17,-19"/></g>
      <g transform="translate(500,488)"><path d="M0,0 q-7,-16 -15,-22"/><path d="M0,0 q1,-20 3,-29"/><path d="M0,0 q8,-14 17,-19"/></g>
      <g transform="translate(740,493)"><path d="M0,0 q-7,-16 -15,-22"/><path d="M0,0 q1,-20 3,-29"/><path d="M0,0 q8,-14 17,-19"/></g>
    </g>
  </g>
</svg>
