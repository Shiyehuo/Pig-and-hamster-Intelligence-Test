<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景天空 -->
  <rect width="800" height="500" fill="#87CEEB"/>
  
  <!-- 太阳 -->
  <circle cx="680" cy="80" r="45" fill="#FFD700"/>
  <circle cx="680" cy="80" r="60" fill="none" stroke="#FFE680" stroke-width="8" opacity="0.5"/>
  
  <!-- 云朵 -->
  <ellipse cx="150" cy="90" rx="50" ry="25" fill="white" opacity="0.9"/>
  <ellipse cx="180" cy="75" rx="40" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="550" cy="130" rx="45" ry="22" fill="white" opacity="0.8"/>
  
  <!-- 草地 -->
  <path d="M0,380 Q200,360 400,375 T800,370 L800,500 L0,500 Z" fill="#7CFC00"/>
  <path d="M0,400 Q200,385 400,395 T800,390 L800,500 L0,500 Z" fill="#3CB371"/>
  
  <!-- 速度线 -->
  <g stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="50" y1="280" x2="120" y2="280"/>
    <line x1="30" y1="320" x2="100" y2="320"/>
    <line x1="60" y1="360" x2="130" y2="360"/>
  </g>
  
  <!-- 奔跑的小猪 -->
  <g transform="translate(200, 180)">
    <!-- 小猪尾巴 -->
    <path d="M280,120 Q300,100 290,85 Q280,70 265,80 Q250,90 260,105 Q268,115 280,120" 
          fill="none" stroke="#FFB6C1" stroke-width="6" stroke-linecap="round"/>
    
    <!-- 小猪身体 -->
    <ellipse cx="180" cy="130" rx="110" ry="70" fill="#FFB6C1"/>
    
    <!-- 小猪背部 -->
    <ellipse cx="180" cy="115" rx="95" ry="45" fill="#FFC0CB"/>
    
    <!-- 小猪头 -->
    <ellipse cx="60" cy="100" rx="55" ry="50" fill="#FFB6C1"/>
    
    <!-- 小猪鼻子 -->
    <ellipse cx="25" cy="110" rx="20" ry="16" fill="#FF9999"/>
    <circle cx="20" cy="108" r="3" fill="#CC6666"/>
    <circle cx="32" cy="108" r="3" fill="#CC6666"/>
    
    <!-- 小猪眼睛 -->
    <ellipse cx="55" cy="85" rx="6" ry="8" fill="#333"/>
    <circle cx="57" cy="82" r="2" fill="white"/>
    
    <!-- 小猪腮红 -->
    <ellipse cx="80" cy="115" rx="10" ry="6" fill="#FF6B9D" opacity="0.5"/>
    
    <!-- 小猪耳朵 -->
    <path d="M40,65 L30,35 L60,55 Z" fill="#FFB6C1"/>
    <path d="M55,60 L50,30 L75,50 Z" fill="#FFB6C1"/>
    
    <!-- 小猪前腿（奔跑抬起） -->
    <g transform="translate(100, 170)">
      <ellipse cx="0" cy="20" rx="15" ry="35" fill="#FFB6C1" transform="rotate(-30)"/>
      <ellipse cx="-5" cy="50" rx="12" ry="8" fill="#FF9999"/>
    </g>
    <g transform="translate(140, 175)">
      <ellipse cx="0" cy="20" rx="15" ry="35" fill="#FFB6C1" transform="rotate(20)"/>
      <ellipse cx="10" cy="50" rx="12" ry="8" fill="#FF9999"/>
    </g>
    
    <!-- 小猪后腿（奔跑抬起） -->
    <g transform="translate(220, 170)">
      <ellipse cx="0" cy="20" rx="16" ry="38" fill="#FFB6C1" transform="rotate(25)"/>
      <ellipse cx="12" cy="52" rx="13" ry="9" fill="#FF9999"/>
    </g>
    <g transform="translate(260, 165)">
      <ellipse cx="0" cy="20" rx="16" ry="38" fill="#FFB6C1" transform="rotate(-20)"/>
      <ellipse cx="-10" cy="50" rx="13" ry="9" fill="#FF9999"/>
    </g>
  </g>
  
  <!-- 仓鼠骑在小猪背上 -->
  <g transform="translate(320, 80)">
    <!-- 仓鼠身体 -->
    <ellipse cx="50" cy="60" rx="40" ry="35" fill="#D4A574"/>
    
    <!-- 仓鼠肚皮 -->
    <ellipse cx="50" cy="70" rx="28" ry="22" fill="#F5DEB3"/>
    
    <!-- 仓鼠头 -->
    <circle cx="50" cy="25" r="30" fill="#D4A574"/>
    
    <!-- 仓鼠耳朵 -->
    <circle cx="28" cy="5" r="10" fill="#D4A574"/>
    <circle cx="72" cy="5" r="10" fill="#D4A574"/>
    <circle cx="28" cy="5" r="6" fill="#FFB6C1"/>
    <circle cx="72" cy="5" r="6" fill="#FFB6C1"/>
    
    <!-- 仓鼠眼睛 -->
    <ellipse cx="38" cy="22" rx="4" ry="5" fill="#333"/>
    <ellipse cx="62" cy="22" rx="4" ry="5" fill="#333"/>
    <circle cx="39" cy="20" r="1.5" fill="white"/>
    <circle cx="63" cy="20" r="1.5" fill="white"/>
    
    <!-- 仓鼠鼻子 -->
    <ellipse cx="50" cy="32" rx="4" ry="3" fill="#FF6B6B"/>
    
    <!-- 仓鼠嘴巴 -->
    <path d="M45,38 Q50,42 55,38" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- 仓鼠腮红 -->
    <ellipse cx="30" cy="32" rx="6" ry="4" fill="#FF9999" opacity="0.6"/>
    <ellipse cx="70" cy="32" rx="6" ry="4" fill="#FF9999" opacity="0.6"/>
    
    <!-- 仓鼠手臂（抓着小猪耳朵） -->
    <ellipse cx="20" cy="55" rx="8" ry="15" fill="#D4A574" transform="rotate(-20)"/>
    <ellipse cx="80" cy="55" rx="8" ry="15" fill="#D4A574" transform="rotate(20)"/>
    
    <!-- 仓鼠小短腿 -->
    <ellipse cx="35" cy="92" rx="10" ry="8" fill="#D4A574"/>
    <ellipse cx="65" cy="92" rx="10" ry="8" fill="#D4A574"/>
    
    <!-- 仓鼠腮帮子（鼓鼓的） -->
    <ellipse cx="25" cy="35" rx="8" ry="6" fill="#D4A574" opacity="0.8"/>
    <ellipse cx="75" cy="35" rx="8" ry="6" fill="#D4A574" opacity="0.8"/>
  </g>
  
  <!-- 尘土飞扬效果 -->
  <g fill="#DEB887" opacity="0.6">
    <ellipse cx="480" cy="370" rx="15" ry="8"/>
    <ellipse cx="510" cy="365" rx="12" ry="6"/>
    <ellipse cx="450" cy="375" rx="10" ry="5"/>
  </g>
  
  <!-- 小花装饰 -->
  <g transform="translate(100, 430)">
    <circle cx="0" cy="0" r="5" fill="#FF69B4"/>
    <circle cx="-7" cy="0" r="5" fill="#FF69B4"/>
    <circle cx="7" cy="0" r="5" fill="#FF69B4"/>
    <circle cx="0" cy="-7" r="5" fill="#FF69B4"/>
    <circle cx="0" cy="7" r="5" fill="#FF69B4"/>
    <circle cx="0" cy="0" r="4" fill="#FFD700"/>
  </g>
  
  <g transform="translate(650, 440)">
    <circle cx="0" cy="0" r="5" fill="#9370DB"/>
    <circle cx="-7" cy="0" r="5" fill="#9370DB"/>
    <circle cx="7" cy="0" r="5" fill="#9370DB"/>
    <circle cx="0" cy="-7" r="5" fill="#9370DB"/>
    <circle cx="0" cy="7" r="5" fill="#9370DB"/>
    <circle cx="0" cy="0" r="4" fill="#FFD700"/>
  </g>
</svg>